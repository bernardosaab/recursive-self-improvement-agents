[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-self-improvement-agent"
version = "0.1.0"
description = "A bounded, independently evaluated agent runtime improvement loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "numpy>=1.26",
  "scipy>=1.11",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
rasis = "recursive_self_improvement_agent.cli:main"
rasis-v3 = "recursive_self_improvement_agent.v3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

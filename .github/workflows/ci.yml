name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Offline smoke run (deterministic fake provider)
        run: rasis --provider fake --db ci.sqlite3 --output ci-results/offline.json
      - name: v3 offline smoke study (simulated backend, small sizes)
        run: rasis-v3 run --provider simulated --approval standing --n-dev 12 --n-selection 20 --n-final 10 --cycles 2 --arms fixed,ratchet,prompt_only --db ci-results/v3.sqlite3 --out ci-results/v3
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: offline-results
          path: ci-results/
